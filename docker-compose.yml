# DB has no host ports; `web` uses hostname `db`. Set all ${VAR:?…} in `.env` (Compose interpolation).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: runner
      args:
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
        DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "${PORT:?Set PORT in .env}:${PORT:?Set PORT in .env}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      TRUST_PROXY: ${TRUST_PROXY:?Set TRUST_PROXY in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

  # Hot reload: `npm run docker:dev` (profile dev).
  web_dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev-runtime
    ports:
      - "${PORT:?Set PORT in .env}:${PORT:?Set PORT in .env}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      TRUST_PROXY: ${TRUST_PROXY:?Set TRUST_PROXY in .env}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - web_dev_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  pg_data:
  web_dev_node_modules:
